name: CI

# Pin the Rust version used by the CI gate (the check that blocks merges when it fails) to 1.98.1. Why:
# `dtolnay/rust-toolchain@stable` can turn CI red after an upstream update, even when no code changed.
# This happened on 2026-09-21: Clippy 1.98 added a new lint.
#
# ⚠️ GitHub Actions `uses:` does not support expressions or environment variables (the GitHub Docs
# "Context availability" table has no `jobs.<job_id>.steps.uses` row, but does have one for `steps.with`).
# Therefore, write the version directly in each `uses: dtolnay/rust-toolchain@<version>` entry.
# The same version appears several times in this file; the `toolchain-pin-guard` job
# (.github/scripts/check-toolchain-pins.py) fails on mismatches.
#
# The MSRV job intentionally pins different versions (1.85.0 / 1.91.0) because its purpose is to
# use each crate’s declared `rust-version`.

on:
  push:
    branches: [redesign/flexaudio-rust, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  third-party-notices:
    name: Third-party notices gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install pinned cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Check generated notices
        run: scripts/gen-third-party-notices.sh --check

  release-version-tests:
    name: Release version gate self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release version validation
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

  lint-test-linux:
    name: Lint & Test (Linux / PipeWire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      - name: Rustfmt (check formatting)
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: >-
          cargo clippy
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi -p flexaudio-py
          --all-targets -- -D warnings
      - name: Doc (deny warnings, docs.rs-equivalent for Linux crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --no-deps
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi
      - name: Test (ignored real-audio tests auto-skip)
        run: >-
          cargo test
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi
      - name: Python binding (maturin build + import)
        run: |
          python3 -m venv /tmp/pyenv
          . /tmp/pyenv/bin/activate
          pip install -q 'maturin[patchelf]'
          maturin build --manifest-path bindings/flexaudio-py/Cargo.toml --out /tmp/wheels
          pip install --no-index --find-links /tmp/wheels flexaudio
          python -m unittest bindings/flexaudio-py/tests/test_contracts.py -v
          # Discovery fails closed: without a PipeWire daemon (this runner) devices()
          # raises a typed BackendError instead of returning a partial list.
          python -c "
          import flexaudio
          try:
              print('flexaudio import OK; devices:', len(flexaudio.devices()))
          except flexaudio.BackendError as error:
              print('flexaudio import OK; discovery failed closed:', error)
          "

  build-test-windows:
    name: Build & Test (Windows / WASAPI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          # For the Clippy step below (Clippy is not installed by default).
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p flexaudio -p flexaudio-os-windows -p flexaudio-mic -p flexaudio-core -p flexaudio-cli -p flexaudio-ffi
      # flexaudio-os-windows can only be built on Windows (on other platforms it compiles to an empty
      # crate via `#[cfg(target_os = "windows")]`), so it is excluded from Linux Clippy.
      # Without this step it would receive no linting. Match Linux strictness (`--all-targets` and
      # `-D warnings`) so the same bug is caught consistently across platforms.
      - name: Clippy (deny warnings, Windows-exclusive crates)
        run: cargo clippy -p flexaudio-os-windows --all-targets -- -D warnings
      # cpal 0.16’s WASAPI backend creates a process-wide `IMMDeviceEnumerator` on the first STA thread,
      # but COM cleanup is thread-local. If a short-lived thread enumerates first, the next cpal call
      # can cause an access violation. flexaudio-mic avoids this upstream bug by initializing first on
      # a long-lived keeper thread; the Windows tests below guard against regressions.
      - name: Test (ignored real-audio tests auto-skip)
        run: cargo test -p flexaudio -p flexaudio-os-windows -p flexaudio-mic -p flexaudio-core -p flexaudio-cli

  windows-napi-reproducibility:
    name: Reproducible Windows x64 N-API release
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Downloads only: neither target objects nor git dependency build products.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: windows-repro-registry-${{ hashFiles('Cargo.lock') }}
      - name: Install locked N-API CLI
        working-directory: crates/flexaudio-napi
        run: npm install --no-package-lock --omit=optional --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Compare independent addon builds
        run: python .github/scripts/check-windows-reproducibility.py
      # The verified addon, for real-device testing of unreleased changes. Not a release artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: napi-win32-x64-msvc-${{ github.sha }}
          path: |
            crates/flexaudio-napi/index.win32-x64-msvc.node
            crates/flexaudio-napi/index.js
            crates/flexaudio-napi/index.d.ts
            crates/flexaudio-napi/package.json
          if-no-files-found: error
          retention-days: 7

  build-test-macos:
    name: Build & Test (macOS / Core Audio Taps)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          # For the Clippy step below (Clippy is not installed by default).
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p flexaudio -p flexaudio-os-macos -p flexaudio-mic -p flexaudio-core -p flexaudio-cli -p flexaudio-ffi
      # flexaudio-os-macos can only be built on macOS (on other platforms it compiles to an empty crate
      # via `#![cfg(target_os = "macos")]`), so it is excluded from Linux Clippy.
      # Without this step it would receive no linting. Match Linux strictness (`--all-targets` and
      # `-D warnings`), for the same reason as Windows.
      - name: Clippy (deny warnings, macOS-exclusive crates)
        run: cargo clippy -p flexaudio-os-macos --all-targets -- -D warnings
      - name: Test (ignored real-audio tests auto-skip)
        run: cargo test -p flexaudio -p flexaudio-os-macos -p flexaudio-mic -p flexaudio-core -p flexaudio-cli

  napi-contract-linux:
    name: N-API contract (Linux / mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test PE dependency checker
        run: node --test crates/flexaudio-napi/__test__/check-pe-dependencies.test.mjs
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      - name: N-API smoke / dual / async-api (mock only)
        run: bash crates/flexaudio-napi/__test__/run-smoke.sh

  smoke-linux-pipewire:
    name: Self-exclusion smoke (Linux / real PipeWire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PipeWire (dev headers + a runnable session)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev \
            pipewire pipewire-pulse pipewire-bin wireplumber pulseaudio-utils dbus dbus-x11
      - name: Start a headless PipeWire session
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-smoke
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          eval "$(dbus-launch --sh-syntax)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          pipewire & sleep 1
          wireplumber & sleep 1
          pipewire-pulse & sleep 1
          pw-cli info 0
      - name: Build the addon
        run: |
          cargo build -p flexaudio-napi --release
          cp target/release/libflexaudio_napi.so crates/flexaudio-napi/__test__/flexaudio.node
      - name: Self-exclusion smoke test
        run: node crates/flexaudio-napi/__test__/exclude-smoke.mjs

  msrv:
    name: MSRV 1.85 (all crates declaring 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          # Install the target’s std library so cross can check platform-specific crates.
          # `cross check` does not need a linker, so Linux can check them.
          targets: aarch64-apple-darwin, x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      # The MSRV gate does not use Clippy. Lints change between versions; here we only
      # need to verify that the code compiles with that version.
      - name: Build at MSRV 1.85 (Linux-native crates)
        run: >-
          cargo build
          -p flexaudio -p flexaudio-core -p flexaudio-mic -p flexaudio-os-linux
          -p flexaudio-cli -p flexaudio-denoise -p flexaudio-encode
      # os-macos / os-windows compile as empty crates on Linux, so cross-check their sources for each
      # target. Cross cannot link them because the MSVC / Apple linker and SDKs are unavailable,
      # so this stops at `check`: it verifies type checking with that version.
      # Linking and real-hardware behavior are covered by native jobs pinned to 1.98.1
      # (build-test-windows / build-test-macos).
      - name: Check at MSRV 1.85 (platform-exclusive crates, cross / check only)
        run: |
          cargo check --all-targets -p flexaudio-os-windows --target x86_64-pc-windows-msvc
          cargo check --all-targets -p flexaudio-os-macos --target aarch64-apple-darwin

  msrv-1_91:
    name: MSRV 1.91 (tract-dependent add-ons)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        # python3-dev is needed for PyO3 (flexaudio-py). Without `extension-module`,
        # `cargo build` links to libpython, so the shared library and headers are required
        # (whether CI actually has everything needed is unverified; see below).
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev python3-dev
      # This job also skips Clippy for the same reason as the MSRV job.
      - name: Build at MSRV 1.91 (ffi / napi / py / vad)
        run: >-
          cargo build
          -p flexaudio-ffi -p flexaudio-napi -p flexaudio-vad -p flexaudio-py

  # ⚠️ This is not a gate. It reports upstream stable changes as an early warning, not a blocker.
  # With `continue-on-error: true`, a failure here leaves CI green (the failure remains visible in Checks).
  # Use it to decide whether to update the gate version (1.98.1). It runs the same Clippy and tests as
  # the Linux gate (same crate list), so the diff shows what changed upstream.
  preview-upstream-stable:
    name: "Preview: upstream Rust stable (NOT a gate — advance warning only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      - name: Clippy (same crate list and strictness as the Linux gate)
        run: >-
          cargo clippy
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi -p flexaudio-py
          --all-targets -- -D warnings
      - name: Test (ignored real-audio tests auto-skip)
        run: >-
          cargo test
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi

  # Check that the gate’s pinned toolchain versions match. Since `uses:` cannot use expressions,
  # the version is repeated and a gate is needed to catch mismatches.
  # Exclude MSRV jobs based on the declared `rust-version` from cargo metadata, not a list of job names.
  # This keeps working as more crates declare an MSRV.
  toolchain-pin-guard:
    name: Toolchain pin guard (gated jobs share one pinned version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Check that every gate pins the same toolchain version
        run: python3 .github/scripts/check-toolchain-pins.py
