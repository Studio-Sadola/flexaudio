name: CI

# The Rust version used by the gates (= checks that stop the line when red) is pinned to
# 1.98.1. Reason: `dtolnay/rust-toolchain@stable` follows upstream releases and can turn CI
# red one day without a single line of our code changing (this actually happened on
# 2026-09-21: clippy 1.98 added a new lint).
#
# ⚠️ GitHub Actions `uses:` accepts neither expressions nor environment variables (the
# GitHub Docs "Context availability" table has no row for `jobs.<job_id>.steps.uses`,
# while `steps.with` has one). So the version has to be written directly into every
# `uses: dtolnay/rust-toolchain@<version>`, and the same version appears many times in
# this file. A mismatched copy is turned red by the `toolchain-pin-guard` job
# (.github/scripts/check-toolchain-pins.py).
#
# Only the MSRV jobs deliberately pin different versions (1.85.0 / 1.91.0), because their
# purpose is to build with the rust-version the crates declare.

on:
  push:
    branches: [redesign/flexaudio-rust, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-test-linux:
    name: Lint & Test (Linux / PipeWire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      - name: Rustfmt (check formatting)
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: >-
          cargo clippy
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi -p flexaudio-py
          --all-targets -- -D warnings
      - name: Doc (deny warnings, docs.rs-equivalent for Linux crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --no-deps
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi
      - name: Test (ignored real-audio tests auto-skip)
        run: >-
          cargo test
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi
      - name: Python binding (maturin build + import)
        run: |
          python3 -m venv /tmp/pyenv
          . /tmp/pyenv/bin/activate
          pip install -q 'maturin[patchelf]'
          maturin build --manifest-path bindings/flexaudio-py/Cargo.toml --out /tmp/wheels
          pip install --no-index --find-links /tmp/wheels flexaudio
          python -c "import flexaudio; assert isinstance(flexaudio.devices(), list); print('flexaudio import OK; devices:', len(flexaudio.devices()))"

  build-test-windows:
    name: Build & Test (Windows / WASAPI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          # For the Clippy step below (clippy is not installed by default).
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p flexaudio -p flexaudio-os-windows -p flexaudio-mic -p flexaudio-core -p flexaudio-cli -p flexaudio-ffi
      # flexaudio-os-windows builds only on Windows (on other targets
      # #[cfg(target_os = "windows")] compiles it to nothing), so the Linux clippy step
      # does not cover it = if it is not linted here, no lint ever runs on it. The
      # strictness matches the Linux side (--all-targets and -D warnings): if only the
      # Linux side were strict, the same mistake would be caught on one platform and
      # missed on another.
      - name: Clippy (deny warnings, Windows-exclusive crates)
        run: cargo clippy -p flexaudio-os-windows --all-targets -- -D warnings
      # cpal 0.16's WASAPI backend creates a process-wide `IMMDeviceEnumerator` on the first
      # STA thread, but its COM cleanup is thread-local. If a short-lived thread enumerates
      # first, the next cpal call hits an access violation. flexaudio-mic works around this
      # upstream defect by initializing first on a long-lived keeper, and the Windows tests
      # below guard against regressions.
      - name: Test (ignored real-audio tests auto-skip)
        run: cargo test -p flexaudio -p flexaudio-os-windows -p flexaudio-mic -p flexaudio-core -p flexaudio-cli

  build-test-macos:
    name: Build & Test (macOS / Core Audio Taps)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          # For the Clippy step below (clippy is not installed by default).
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p flexaudio -p flexaudio-os-macos -p flexaudio-mic -p flexaudio-core -p flexaudio-cli -p flexaudio-ffi
      # flexaudio-os-macos builds only on macOS (on other targets
      # #![cfg(target_os = "macos")] compiles it to nothing), so the Linux clippy step
      # does not cover it = if it is not linted here, no lint ever runs on it. The
      # strictness matches the Linux side (--all-targets and -D warnings), for the same
      # reason as on Windows.
      - name: Clippy (deny warnings, macOS-exclusive crates)
        run: cargo clippy -p flexaudio-os-macos --all-targets -- -D warnings
      - name: Test (ignored real-audio tests auto-skip)
        run: cargo test -p flexaudio -p flexaudio-os-macos -p flexaudio-mic -p flexaudio-core -p flexaudio-cli

  napi-contract-linux:
    name: N-API contract (Linux / mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test PE dependency checker
        run: node --test crates/flexaudio-napi/__test__/check-pe-dependencies.test.mjs
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      - name: N-API smoke / dual / async-api (mock only)
        run: bash crates/flexaudio-napi/__test__/run-smoke.sh

  msrv:
    name: MSRV 1.85 (all crates declaring 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          # Install those targets' std so the platform-exclusive crates can be checked
          # cross (a cross `check` needs no linker, so it runs from Linux).
          targets: aarch64-apple-darwin, x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      # The MSRV gates do not run clippy. Lints change between versions; all we want to
      # know here is whether the code compiles with that version.
      - name: Build at MSRV 1.85 (Linux-native crates)
        run: >-
          cargo build
          -p flexaudio -p flexaudio-core -p flexaudio-mic -p flexaudio-os-linux
          -p flexaudio-cli -p flexaudio-denoise -p flexaudio-encode
      # os-macos / os-windows compile to nothing on Linux, so cross-compile each one to its
      # own target to compile the real code. A cross build cannot link (no MSVC / Apple
      # linker or SDK), so this stops at `check`: it only verifies that type checking
      # passes with that version; linking and on-device behaviour are covered by the
      # native jobs pinned to 1.98.1 (build-test-windows / build-test-macos).
      - name: Check at MSRV 1.85 (platform-exclusive crates, cross / check only)
        run: |
          cargo check --all-targets -p flexaudio-os-windows --target x86_64-pc-windows-msvc
          cargo check --all-targets -p flexaudio-os-macos --target aarch64-apple-darwin

  msrv-1_91:
    name: MSRV 1.91 (tract-dependent add-ons)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        # python3-dev is for PyO3 (flexaudio-py): a cargo build without
        # extension-module links against libpython, so it needs the shared library
        # and headers (whether this is sufficient on CI is unverified; see the report below).
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev python3-dev
      # No clippy here either (same reason as the msrv job).
      - name: Build at MSRV 1.91 (ffi / napi / py / vad)
        run: >-
          cargo build
          -p flexaudio-ffi -p flexaudio-napi -p flexaudio-vad -p flexaudio-py

  # ⚠️ This is NOT a gate. It is an advance warning, so that a change in upstream stable
  # arrives as a "heads-up" rather than as "red". With continue-on-error: true, CI as a
  # whole stays green even if this fails (the failure is still recorded in Checks). Use
  # it as input when deciding whether to bump the gate version (1.98.1). Its contents are
  # the same clippy and test as the Linux gate (same crate list), so any difference is
  # exactly "what changed upstream".
  preview-upstream-stable:
    name: "Preview: upstream Rust stable (NOT a gate — advance warning only)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev
      - name: Clippy (same crate list and strictness as the Linux gate)
        run: >-
          cargo clippy
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi -p flexaudio-py
          --all-targets -- -D warnings
      - name: Test (ignored real-audio tests auto-skip)
        run: >-
          cargo test
          -p flexaudio -p flexaudio-core -p flexaudio-cli -p flexaudio-mic
          -p flexaudio-os-linux -p flexaudio-vad -p flexaudio-napi
          -p flexaudio-encode -p flexaudio-denoise
          -p flexaudio-ffi

  # Checks that the gates' pinned toolchain versions do not disagree. Since `uses:` cannot
  # take an expression, the version is copied many times, so a gate is needed to turn a
  # mismatched copy red.
  # MSRV jobs are excluded based on the "declared rust-version" taken from cargo metadata,
  # not on a list of job names (so it keeps working as more crates declare an MSRV).
  toolchain-pin-guard:
    name: Toolchain pin guard (gated jobs share one pinned version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Check that every gate pins the same toolchain version
        run: python3 .github/scripts/check-toolchain-pins.py
