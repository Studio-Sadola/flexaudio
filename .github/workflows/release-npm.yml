# Build the napi-rs native addon for every supported platform and publish the
# npm packages (the main `@studio-sadola/flexaudio` package plus one per-platform
# optional package, the standard napi-rs distribution model).
#
# === What the maintainer must set up ===
#  - Configure Trusted Publishing on npmjs.com for the main package and all five
#    platform packages: GitHub Actions, repo Studio-Sadola/flexaudio, workflow
#    release-npm.yml, no environment, allowed action npm publish only.
#  - Publishing authenticates with GitHub OIDC; no long-lived npm token is needed.
#    Re-create each package's Trusted Publisher if this workflow file is renamed.
#  - Packages are published with `--access public` and `--provenance`. OIDC auth
#    and provenance require `id-token: write` on the publish job; provenance also
#    requires a public repository and links packages to this workflow run.
#
# Triggered by a version tag (e.g. v0.2.0) or run manually. No-op on PRs.

name: Release (npm)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH, without v)"
        type: string
        required: true
      dry_run:
        description: "Build all platforms but skip the npm publish step"
        type: boolean
        default: true

permissions:
  contents: read

# All napi commands run inside the addon crate directory.
defaults:
  run:
    working-directory: crates/flexaudio-napi

jobs:
  version-gate:
    name: Validate release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag or explicit dispatch version
        id: check
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            python3 .github/scripts/check-release-versions.py --tag "$REF_NAME"
            VERSION="${REF_NAME#v}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 .github/scripts/check-release-versions.py --version "$INPUT_VERSION"
            VERSION="$INPUT_VERSION"
          else
            echo "::error::Unsupported release trigger."
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build addon (${{ matrix.target }})
    needs: version-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Matrix of host runner + Rust target triple.
      #
      # Covered: linux x64, linux arm64 (native on a hosted arm64 runner),
      # macOS arm64, windows x64/arm64. This matches the napi "triples" /
      # optionalDependencies in package.json.
      #
      # macOS x64 (Intel) is deliberately left out of the prebuilt package matrix.
      # Rust users on Intel Macs can still build from crates.io. Re-enable it only
      # together with a supported runner and package target.
      #
      # Windows on arm64 has no hosted runner, but napi-rs cross-compiles it
      # cleanly from the x64 Windows runner (VS ships the ARM64 toolchain).
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Linux native deps (same set as ci.yml). Both linux targets build
      # natively on their own runner (x64 on ubuntu-latest, arm64 on the hosted
      # arm64 runner), so no cross toolchain is needed.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev

      - name: Install npm dependencies (@napi-rs/cli)
        run: npm ci || npm install

      # napi build --platform writes the .node next to index.js and emits the
      # per-platform package suffix from package.json's "napi" config.
      - name: Build native addon (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: npx napi build --platform --release --target "$BUILD_TARGET"

      - name: Build native addon (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          BUILD_TARGET: ${{ matrix.target }}
        run: npx napi build --platform --release --target "$BUILD_TARGET"

      # The addon is built with the static CRT (see RUSTFLAGS above), so it must
      # not pull in an MSVC redistributable DLL (msvcp*/vcruntime*/vcomp*) or an
      # inference runtime that would have to ship next to it (DirectML / onnxruntime).
      # Those names are rejected outright, even if someone adds them to the allowlist.
      # The checker reads both PE import tables itself, in Node, via
      # crates/flexaudio-napi/__test__/check-pe-dependencies.mjs. It accepts
      # only documented Windows-provided DLLs (and api-ms-win-* API sets): the
      # imported dependency set minus that allowlist must be empty. Thus a new
      # bundled dependency fails even before it appears in a forbidden pattern.
      #
      # It deliberately does NOT call dumpbin: dumpbin ships with MSVC and is
      # only on PATH inside a developer command prompt, so the check used to
      # depend on the runner's environment rather than on the artifact (it
      # failed with "The term 'dumpbin' is not recognized ..." on run
      # 35509560651 and skipped the artifact upload, even though the build
      # itself had succeeded).
      - name: Verify native addon dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          nodes=(./*.node)
          if [ "${#nodes[@]}" -eq 0 ]; then
            echo "::error::napi build produced no .node file to inspect"
            exit 1
          fi
          # Relative to the job's defaults.run.working-directory
          # (crates/flexaudio-napi), same as the ./*.node glob above.
          node ./__test__/check-pe-dependencies.mjs "${nodes[@]}"

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          # The *.node files (named flexaudio.<platform>.node) are the build
          # outputs we hand to the publish job.
          path: crates/flexaudio-napi/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [version-gate, build]
    permissions:
      contents: read
      # Only publishing requires OIDC for Trusted Publishing and provenance.
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version-gate.outputs.version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/flexaudio-napi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing requires npm 11.5.1 or newer.
      - name: Upgrade npm CLI and verify Trusted Publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@latest
          NPM_VERSION="$(npm --version)"
          echo "npm version: $NPM_VERSION"
          node - "$NPM_VERSION" <<'JAVASCRIPT'
          const version = process.argv[2];
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
          const parts = match ? match.slice(1).map(Number) : [];
          const [major, minor, patch] = parts;
          if (!match || !parts.every(Number.isSafeInteger) ||
              !(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            console.error('::error::Trusted Publishing requires npm >= 11.5.1.');
            process.exit(1);
          }
          JAVASCRIPT

      - name: Install npm dependencies (@napi-rs/cli)
        run: npm ci || npm install

      # Pull every per-platform .node back into the crate dir.
      - name: Download all addon artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/flexaudio-napi/artifacts
          pattern: bindings-*
          merge-multiple: true

      # napi creates one npm package dir per platform under npm/ and moves each
      # downloaded .node into it. The root package.json already declares the
      # matching optionalDependencies and index.js/index.d.ts are committed, so
      # version and license checks below validate the generated packages.
      # We intentionally do NOT run `napi prepublish`: in napi-rs v2 it
      # actually *publishes* the per-platform
      # packages, which the explicit, auth-gated npm publish step below handles.)
      - name: Prepare per-platform npm packages
        shell: bash
        run: |
          set -euo pipefail
          npx napi create-npm-dir -t .
          npx napi artifacts --dir artifacts
          python3 ../../.github/scripts/check-release-versions.py --version "$RELEASE_VERSION" --require-platforms
          python3 - <<'PYTHON'
          import json
          import shutil
          from pathlib import Path

          notices = ("LICENSE", "THIRD_PARTY_NOTICES.md")
          for directory in sorted(Path("npm").iterdir()):
              manifest = directory / "package.json"
              package = json.loads(manifest.read_text(encoding="utf-8"))
              files = package.get("files")
              if not isinstance(files, list) or not all(isinstance(item, str) for item in files):
                  raise SystemExit("Generated platform manifest must have a string files array")
              for name in notices:
                  shutil.copyfile(name, directory / name)
                  if name not in files:
                      files.append(name)
              manifest.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PYTHON

      - name: Verify license files before publishing or dry run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          for directory in (Path("."), *sorted(Path("npm").iterdir())):
              package = json.loads((directory / "package.json").read_text(encoding="utf-8"))
              for name in ("LICENSE", "THIRD_PARTY_NOTICES.md"):
                  if name not in package.get("files", []) or not (directory / name).is_file():
                      raise SystemExit(f"Missing packaged license file: {directory / name}")
          PYTHON

      - name: Publish (root + per-platform packages)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          set -euo pipefail
          # Publish each per-platform package first...
          # --ignore-scripts: the root package.json has a napi-rs `prepublishOnly`
          # hook (`napi prepublish`) that would otherwise fire on `npm publish` and
          # try to cut a GitHub release + re-publish the platform packages itself.
          # We publish explicitly here, so skip lifecycle scripts entirely.
          for dir in npm/*/; do
            (
              cd "$dir"
              PACKAGE_SPEC="$(node -e 'const p = require("./package.json"); process.stdout.write(`${p.name}@${p.version}`)')"
              if npm view "$PACKAGE_SPEC" version >/dev/null 2>&1; then
                echo "$PACKAGE_SPEC already published — skipping."
              else
                npm publish --ignore-scripts --access public --provenance
              fi
            )
          done
          # ...then the main package that depends on them.
          npm publish --ignore-scripts --access public --provenance

      - name: Dry run (validate packaging, skip publish)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          echo "dry_run=true → validate every package's packaging, do not publish."
          # --dry-run is a local pack/simulation (no auth, no upload). Let it fail
          # loudly so packaging problems are caught here instead of at real publish.
          for dir in npm/*/; do
            echo "::group::dry-run ${dir}"
            ( cd "$dir" && npm publish --ignore-scripts --dry-run )
            echo "::endgroup::"
          done
          npm publish --ignore-scripts --dry-run
