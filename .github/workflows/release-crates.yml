# Publish the flexaudio Rust crates to crates.io.
#
# === What the maintainer must set up ===
#  - Default (token) auth: add a repository secret named CARGO_REGISTRY_TOKEN
#    (Settings → Secrets and variables → Actions → New repository secret).
#    Generate the token at https://crates.io/settings/tokens with the
#    "publish-new" + "publish-update" scopes.
#  - Alternative (no token) — crates.io Trusted Publishing via OIDC:
#    register this repo + workflow as a Trusted Publisher for each crate at
#    https://crates.io/crates/<name>/settings, then use the OIDC exchange shown
#    in the commented block below instead of CARGO_REGISTRY_TOKEN. That needs
#    `permissions: id-token: write` on the publish job and removes the secret.
#
# Triggered by pushing a version tag (e.g. v0.2.0) or run manually. It is a
# no-op on ordinary pushes / PRs.

name: Release (crates.io)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH, without v)"
        type: string
        required: true
      dry_run:
        description: "Build/package only; do not actually publish to crates.io"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version-gate:
    name: Validate release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag or explicit dispatch version
        id: check
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            python3 .github/scripts/check-release-versions.py --tag "$REF_NAME"
            VERSION="${REF_NAME#v}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 .github/scripts/check-release-versions.py --version "$INPUT_VERSION"
            VERSION="$INPUT_VERSION"
          else
            echo "::error::Unsupported release trigger."
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish crates (dependency order)
    needs: version-gate
    runs-on: ubuntu-latest
    env:
      # cargo publish reads this automatically. Keep it scoped to this job.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      RELEASE_VERSION: ${{ needs.version-gate.outputs.version }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate publish order and derive dry-run leaves
        id: release-plan
        shell: bash
        run: |
          set -euo pipefail

          # Publish dependencies first and the facade last. flexaudio-cli /
          # -ffi / -napi / -py are publish=false and intentionally excluded.
          CRATES=(
            flexaudio-core
            flexaudio-mic
            flexaudio-os-linux
            flexaudio-os-macos
            flexaudio-os-windows
            flexaudio-vad
            flexaudio-encode
            flexaudio-denoise
            flexaudio
          )

          METADATA="$(cargo metadata --format-version 1 --no-deps --offline)"
          python3 .github/scripts/workspace-leaf-crates.py verify-order "${CRATES[@]}" <<< "$METADATA"
          LEAVES="$(python3 .github/scripts/workspace-leaf-crates.py leaves "${CRATES[@]}" <<< "$METADATA")"
          printf 'crates=%s\n' "${CRATES[*]}" >> "$GITHUB_OUTPUT"
          printf 'leaves=%s\n' "${LEAVES//$'\n'/ }" >> "$GITHUB_OUTPUT"

      # Same system dependencies as ci.yml so the Linux crates resolve their
      # native deps (PipeWire / ALSA / libclang). The platform-specific Windows
      # and macOS crates are published with --no-verify (see below), so their
      # native SDKs are not needed on this Linux runner.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev

      # --- Optional: crates.io Trusted Publishing (OIDC), token-free ---
      # Uncomment to mint a short-lived token from GitHub's OIDC identity and
      # drop the CARGO_REGISTRY_TOKEN secret entirely. Requires each crate to be
      # registered as a Trusted Publisher on crates.io.
      #
      # - name: Authenticate to crates.io via OIDC
      #   uses: rust-lang/crates-io-auth-action@v1
      #   id: auth
      # # then export the minted token for the publish step:
      # # Pass steps.auth.outputs.token through the publish step env, not a run script.

      - name: Publish crates in dependency order
        shell: bash
        env:
          PUBLISH_CRATES: ${{ steps.release-plan.outputs.crates }}
          LEAF_CRATES: ${{ steps.release-plan.outputs.leaves }}
        run: |
          set -euo pipefail
          read -r -a CRATES <<< "$PUBLISH_CRATES"

          VERSION="$RELEASE_VERSION"
          echo "Publishing flexaudio workspace version ${VERSION}"

          UA="flexaudio-release-workflow (https://github.com/${GITHUB_REPOSITORY})"

          # Return 0 if <name>@<version> is already on the crates.io index.
          already_published() {
            local name="$1" ver="$2"
            curl -fsSL -A "${UA}" "https://crates.io/api/v1/crates/${name}/${ver}" \
              >/dev/null 2>&1
          }

          # Block until <name>@<version> is visible on the index, so the next
          # crate in the chain can resolve it. crates.io index propagation is
          # not instantaneous; a fixed sleep is fragile, so we poll.
          wait_for_index() {
            local name="$1" ver="$2"
            echo "Waiting for ${name}@${ver} to appear on the crates.io index..."
            for _ in $(seq 1 60); do
              if already_published "${name}" "${ver}"; then
                echo "  ${name}@${ver} is live."
                return 0
              fi
              sleep 5
            done
            echo "::error::Timed out waiting for ${name}@${ver} on crates.io index."
            return 1
          }

          # Publish one crate, waiting out crates.io's new-crate rate limit
          # instead of failing on it. Publishing several brand-new crates in a
          # row trips a 429 ("published too many new crates in a short period");
          # crates.io then allows roughly one more every ~10 minutes. On a 429 we
          # sleep and retry the same crate rather than letting the run go red, so
          # a first-time multi-crate release completes in a single (slow) run.
          # Any non-429 failure is a real error and stops the run.
          publish_with_retry() {
            local crate="$1" attempt
            for attempt in $(seq 1 10); do
              if cargo publish -p "${crate}" --no-verify 2>/tmp/pub_err.txt; then
                cat /tmp/pub_err.txt >&2 || true
                return 0
              fi
              cat /tmp/pub_err.txt >&2 || true
              if grep -qi "429 Too Many Requests" /tmp/pub_err.txt; then
                echo "::notice::${crate}: crates.io new-crate rate limit hit; waiting ~11 min then retrying (attempt ${attempt}/10)."
                sleep 660
                continue
              fi
              return 1
            done
            echo "::error::${crate}: still rate-limited after 10 attempts."
            return 1
          }

          for crate in "${CRATES[@]}"; do
            echo "::group::${crate}"

            if already_published "${crate}" "${VERSION}"; then
              # Idempotent re-runs: treat an already-published version as success
              # (not an error), so re-triggering the tag does not fail.
              echo "${crate}@${VERSION} already published — skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              # cargo publish --dry-run resolves deps against the live index, so a
              # crate that depends on another *workspace* crate fails ("no matching
              # package") until that dep is actually published — a chicken-and-egg
              # cargo can't solve in a dry run. So in dry-run we only package the
              # leaf crates (no workspace deps); the dependent crates are exercised
              # for real at publish time, where wait_for_index makes each dep
              # resolvable before the next crate goes up.
              # --no-verify: os-windows/os-macos can't verification-build on Linux
              # (native SDKs absent); each OS is already verified in ci.yml.
              case " ${LEAF_CRATES} " in
                *" ${crate} "*)
                  echo "[dry-run] cargo publish -p ${crate} --no-verify"
                  cargo publish -p "${crate}" --no-verify --dry-run --allow-dirty
                  ;;
                *)
                  echo "[dry-run] skip ${crate} (depends on workspace crates not yet on the index; validated at real publish)"
                  ;;
              esac
              echo "::endgroup::"
              continue
            fi

            echo "Publishing ${crate}@${VERSION}..."
            publish_with_retry "${crate}"

            # Don't wait after the final crate; nothing depends on it.
            if [ "${crate}" != "flexaudio" ]; then
              wait_for_index "${crate}" "${VERSION}"
            fi

            echo "::endgroup::"
          done

          echo "All crates processed."
