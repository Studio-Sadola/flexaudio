[package]
name = "flexaudio-os-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "macOS system and per-process audio capture backend (Core Audio process taps) for flexaudio."
readme = "README.md"
keywords = ["audio", "coreaudio", "loopback", "capture", "macos"]
categories = ["multimedia::audio", "os::macos-apis"]
documentation = "https://docs.rs/flexaudio-os-macos"

# macOS only. On non-macOS targets lib.rs compiles to nothing via
# `#![cfg(target_os = "macos")]`, and the objc2-family dependencies are pulled in only by the
# target-specific section below (Linux/Windows builds are unaffected).
#
# Versions match the existing pins in Cargo.lock (the objc2 family pulled in by cpal) to avoid
# compiling duplicates.
[target.'cfg(target_os = "macos")'.dependencies]
flexaudio-core = { path = "../flexaudio-core", version = "0.3.0" }
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = [
    "NSArray",
    "NSValue",
    "NSString",
    "NSUUID",
    "NSDictionary",
] }
# The default features include AudioHardware / objc2-core-audio-types etc.
objc2-core-audio = "=0.3.2"
objc2-core-audio-types = "=0.3.2"
objc2-core-foundation = { version = "=0.3.2", features = [
    "CFDictionary",
    "CFString",
    "CFNumber",
    "CFArray",
    "CFBase",
] }
block2 = "=0.6.2"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
