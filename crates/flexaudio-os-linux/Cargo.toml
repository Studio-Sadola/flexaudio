[package]
name = "flexaudio-os-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Linux system and per-process audio capture backend (PipeWire) for flexaudio."
readme = "README.md"
keywords = ["audio", "pipewire", "loopback", "capture", "linux"]
categories = ["multimedia::audio", "os::unix-apis"]
documentation = "https://docs.rs/flexaudio-os-linux"

# Linux only. On non-Linux targets lib.rs is emptied by `#![cfg(target_os = "linux")]`, and the
# pipewire dependency is pulled in only by the target-specific section below.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { workspace = true }
flexaudio-core = { path = "../flexaudio-core", version = "0.3.0" }
