[package]
name = "flexaudio-mic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform microphone capture backend (cpal) for flexaudio."
readme = "README.md"
keywords = ["audio", "microphone", "capture", "cpal", "recording"]
categories = ["multimedia::audio"]
documentation = "https://docs.rs/flexaudio-mic"

[dependencies]
flexaudio-core = { path = "../flexaudio-core", version = "0.3.1" }
cpal = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = ["NSBundle", "NSString", "NSObject"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.54.0", features = ["Foundation", "Security_Authorization_AppCapabilityAccess"] }
