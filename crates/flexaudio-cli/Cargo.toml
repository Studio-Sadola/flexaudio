[package]
name = "flexaudio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reference command-line capture tool for flexaudio (WAV output and raw-PCM streaming)."
# Binary; not published to crates.io for now.
publish = false

[[bin]]
name = "flexaudio-cli"
path = "src/main.rs"

[dependencies]
flexaudio = { path = "../flexaudio" }
flexaudio-mic = { path = "../flexaudio-mic" }
# WAV output (pure Rust, no system libraries, permissive Apache-2.0/MIT/Zlib licenses).
hound = "3.5"
# Argument parsing (pure Rust, permissive Apache-2.0/MIT licenses).
clap = { version = "4", features = ["derive"] }
# Ctrl-C (SIGINT) handler for clean shutdown of infinite streaming (--seconds 0).
# Pure Rust and OS signal API only; no runtime network access (permissive MIT/Apache-2.0 licenses).
ctrlc = "3"

# System audio (PipeWire) backend for --source system (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
flexaudio-os-linux = { path = "../flexaudio-os-linux" }
