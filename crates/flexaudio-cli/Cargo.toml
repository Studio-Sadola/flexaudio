[package]
name = "flexaudio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reference command-line capture tool for flexaudio (WAV output and raw-PCM streaming)."
# Binary. Not published to crates.io for now.
publish = false

[[bin]]
name = "flexaudio-cli"
path = "src/main.rs"

[dependencies]
flexaudio = { path = "../flexaudio" }
flexaudio-mic = { path = "../flexaudio-mic" }
# WAV writing (pure Rust, no system libraries required, permissive license Apache-2.0/MIT/Zlib).
hound = "3.5"
# Argument parsing (pure Rust, permissive license Apache-2.0/MIT).
clap = { version = "4", features = ["derive"] }
# Ctrl-C (SIGINT) handler. Used to stop infinite streaming (--seconds 0) cleanly.
# Pure Rust + OS signal APIs only (no network access at runtime, permissive license MIT/Apache-2.0).
ctrlc = "3"

# System audio (PipeWire) backend. For --source system (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
flexaudio-os-linux = { path = "../flexaudio-os-linux" }
