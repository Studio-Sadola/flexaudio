[package]
name = "flexaudio-denoise"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline noise suppression (RNNoise via nnnoiseless, model weights embedded) for flexaudio."
keywords = ["denoise", "rnnoise", "noise-suppression", "audio", "dsp"]
categories = ["multimedia::audio"]
readme = "README.md"
documentation = "https://docs.rs/flexaudio-denoise"

[dependencies]
# Pure Rust port of RNNoise (BSD-3-Clause). Model weights are embedded in the crate,
# so no model files or network access are needed at runtime. Disable default features,
# which pull in the CLI (`bin` = clap/hound, etc.) and dasp integration, and use only
# the library itself (easyfft + once_cell).
nnnoiseless = { version = "0.5", default-features = false }
