[package]
name = "flexaudio-vad"
version.workspace = true
edition.workspace = true
license.workspace = true
# tract-onnx 0.23.7 requires rust-version 1.91, so override the workspace's 1.85 here only.
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "Offline Voice Activity Detection (Silero VAD on tract-onnx, model embedded) for flexaudio."
keywords = ["vad", "voice", "silero", "onnx", "audio"]
categories = ["multimedia::audio", "science"]
readme = "README.md"
documentation = "https://docs.rs/flexaudio-vad"

[dependencies]
# Run silero-VAD offline with the pure-Rust ONNX inference engine tract-onnx. No C/C++ runtime or
# onnxruntime DLL is needed (a single self-contained binary). Optimize the plan once at startup with
# `into_optimized` and reuse it for every frame.
tract-onnx = "=0.23.7"

# Used for resampling before process_pcm (any SR → VAD rate). This sinc resampler includes
# anti-aliasing; keep its major version aligned with flexaudio-core.
# Capture phase alignment is derived from this engine's initialization/kernel convention.
rubato = "=3.0.0"

[[example]]
name = "probe"
path = "examples/probe.rs"

[dev-dependencies]
flate2 = "=1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
