[package]
name = "flexaudio-vad"
version.workspace = true
edition.workspace = true
license.workspace = true
# tract-onnx 0.23.7 has rust-version 1.91, so override the workspace's 1.85 for this crate only.
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "Offline Voice Activity Detection (Silero VAD on tract-onnx, model embedded) for flexaudio."
keywords = ["vad", "voice", "silero", "onnx", "audio"]
categories = ["multimedia::audio", "science"]
readme = "README.md"
documentation = "https://docs.rs/flexaudio-vad"

[dependencies]
# Runs silero-VAD offline on tract-onnx, a pure-Rust ONNX inference engine. Neither a C/C++
# runtime nor the onnxruntime DLL is needed (a single self-contained binary). The plan is
# `into_optimized` once at startup and reused for every frame.
tract-onnx = "=0.23.7"

# Used for process_pcm's front-end resampling (any SR → VAD rate). A sinc resampler with
# anti-aliasing, kept on the same major version as flexaudio-core.
rubato = { workspace = true }

[[example]]
name = "probe"
path = "examples/probe.rs"
