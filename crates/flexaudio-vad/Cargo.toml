[package]
name = "flexaudio-vad"
version.workspace = true
edition.workspace = true
license.workspace = true
# tract-onnx 0.23.7 の rust-version が 1.91 なので、workspace の 1.85 をここだけ上書きする。
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "Offline Voice Activity Detection (Silero VAD on tract-onnx, model embedded) for flexaudio."
keywords = ["vad", "voice", "silero", "onnx", "audio"]
categories = ["multimedia::audio", "science"]
readme = "README.md"
documentation = "https://docs.rs/flexaudio-vad"

[dependencies]
# silero-VAD を純 Rust の ONNX 推論器 tract-onnx でオフライン実行する。C/C++ ランタイム
# も onnxruntime の DLL も要らない（単一の自己完結バイナリ）。計画は起動時に一度
# `into_optimized` し、フレームごとに使い回す。
tract-onnx = "=0.23.7"

# process_pcm の前段リサンプル（任意 SR → VAD レート）に使う。アンチエイリアス込みの
# sinc リサンプラで、flexaudio-core と同じメジャーバージョンに揃える。
rubato = { workspace = true }

[[example]]
name = "probe"
path = "examples/probe.rs"
