[package]
name = "flexaudio-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
# The VAD addon (flexaudio-vad → tract-onnx 0.23.7) requires rust-version 1.91, so override the
# workspace's 1.85 here only (as for napi).
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "C FFI bindings for flexaudio (pull-based C ABI; header generated by cbindgen)."
# A staticlib/cdylib cannot be consumed as a library from crates.io (it is linked directly from C).
# Keep it unpublished, as with napi.
publish = false

# The third way to call flexaudio from C (first is the CLI pipe, second is the N-API addon). Exposes
# a pull-based C ABI where the caller periodically invokes poll_chunk / poll_event. Builds both a
# staticlib (.a) and a cdylib (.so/.dll/.dylib).
[lib]
name = "flexaudio_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
flexaudio = { path = "../flexaudio" }
# Addons exposed through the C ABI (VAD / FLAC / denoise). All are offline processing and need no
# runtime network access.
flexaudio-vad = { path = "../flexaudio-vad" }
flexaudio-encode = { path = "../flexaudio-encode" }
flexaudio-denoise = { path = "../flexaudio-denoise" }
