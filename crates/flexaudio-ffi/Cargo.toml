[package]
name = "flexaudio-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
# The VAD addon (flexaudio-vad → tract-onnx 0.23.7) has rust-version 1.91, so the
# workspace's 1.85 is overridden here only (same for napi).
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "C FFI bindings for flexaudio (pull-based C ABI; header generated by cbindgen)."
# A staticlib/cdylib cannot be consumed as a library from crates.io (it is linked
# directly from C). Like napi, it is not published.
publish = false

# The third way to call in from C (the first is the CLI pipe, the second is the N-API
# addon). Exposes a pull-based C ABI where the caller periodically calls
# poll_chunk / poll_event. Builds both a staticlib (.a) and a cdylib (.so/.dll/.dylib).
[lib]
name = "flexaudio_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
flexaudio = { path = "../flexaudio" }
# Addons (VAD / FLAC / denoise exposed through the C ABI). All are purely offline
# processing and need no network at runtime.
flexaudio-vad = { path = "../flexaudio-vad" }
flexaudio-encode = { path = "../flexaudio-encode" }
flexaudio-denoise = { path = "../flexaudio-denoise" }
