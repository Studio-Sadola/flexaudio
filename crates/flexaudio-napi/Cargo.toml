[package]
name = "flexaudio-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
# Besides napi-build / napi-derive, flexaudio-vad (tract-onnx 0.23.7) requires rustc 1.91, so
# the workspace's 1.85 is overridden here only.
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "Node.js (N-API) addon for flexaudio. Distributed via npm, not crates.io."
# A cdylib cannot be consumed as a library from crates.io (distributed via npm).
publish = false

# Node.js (N-API) addon. The second path for TS/Electron apps to call flexaudio in-process
# (the first is the CLI pipe). The cdylib is renamed to .node and loaded.
[lib]
crate-type = ["cdylib"]

[dependencies]
flexaudio = { path = "../flexaudio" }

# Exposes the three add-ons to Node. All are pure Rust (models embedded) and need neither
# model files nor network at runtime. Versions follow each workspace crate (path
# dependencies). vad requiring rustc 1.91 is already allowed by the rust-version above.
flexaudio-vad = { path = "../flexaudio-vad" }
flexaudio-encode = { path = "../flexaudio-encode" }
flexaudio-denoise = { path = "../flexaudio-denoise" }

# Latest stable of the napi-rs 2.x line (2.16.17).
# - napi6: needed to pass BigInt to JS (AudioChunk.seq: u64 becomes a BigInt).
# - tokio_rt: enabled as the minimal setup for using ThreadsafeFunction (needed by napi's
#   TSFN path).
# No network at runtime (napi is only the N-API bridge; no communication).
napi = { version = "2.16", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2.16"

[build-dependencies]
# build.rs calls napi_build::setup() (cdylib symbol setup etc.). Build time only.
napi-build = "2"
