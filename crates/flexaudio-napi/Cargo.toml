[package]
name = "flexaudio-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
# In addition to napi-build and napi-derive, flexaudio-vad (tract-onnx 0.23.7) requires rustc 1.91,
# so override the workspace's 1.85 here only.
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "Node.js (N-API) addon for flexaudio. Distributed via npm, not crates.io."
# A cdylib cannot be consumed as a library from crates.io (it is distributed via npm).
publish = false

# Node.js (N-API) addon. This is the second way for TS/Electron apps to call flexaudio in-process
# (the first is the CLI pipe). Rename the cdylib to .node and load it.
[lib]
crate-type = ["cdylib"]

# cargo test --workspace builds this live addon for the Node integration test.
[[example]]
name = "capture_test_addon"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false

[dependencies]
flexaudio = { path = "../flexaudio" }

# Expose three addons to Node. All are pure Rust (the model is embedded), so neither model files nor
# network access are needed at runtime. Versions follow the workspace crates via path dependencies.
# vad's rustc 1.91 requirement is allowed by the rust-version above.
flexaudio-vad = { path = "../flexaudio-vad" }
flexaudio-encode = { path = "../flexaudio-encode" }
flexaudio-denoise = { path = "../flexaudio-denoise" }

# Latest stable in the napi-rs 2.x series (2.16.17).
# - napi6: required to pass BigInt to JS (converts AudioChunk.seq:u64 to BigInt).
# - tokio_rt: enabled as the minimal setup for ThreadsafeFunction (needed by napi's TSFN path).
# There is no runtime network access (napi is only an N-API bridge; no communication).
napi = { version = "2.16", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2.16"

[build-dependencies]
# Call napi_build::setup() from build.rs (for cdylib symbol settings, etc.). Build-time only.
napi-build = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flexaudio_repro_addon)'] }
