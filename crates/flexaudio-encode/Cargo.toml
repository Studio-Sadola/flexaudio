[package]
name = "flexaudio-encode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Streaming FLAC encoding sink for recorded audio (pure Rust, fully offline)."
keywords = ["flac", "audio", "encoder", "lossless", "recording"]
categories = ["multimedia::audio", "multimedia::encoding", "compression"]
readme = "README.md"
documentation = "https://docs.rs/flexaudio-encode"

[dependencies]
# Pure-Rust FLAC encoder (Apache-2.0). The default features (log/par/serde) are for
# multithreading the bulk-encode path and for serializing settings, and are not needed for
# frame-by-frame incremental encoding, so they are dropped (no crossbeam-channel / serde / log).
flacenc = { version = "0.5", default-features = false }
thiserror = { workspace = true }
# The canonical f32→s16 quantization (core's quantize_i16 is used so that every layer shares
# the same implementation).
flexaudio-core = { path = "../flexaudio-core", version = "0.3.0" }

[dev-dependencies]
# Pure-Rust FLAC decoder for round-trip verification (Apache-2.0). Tests only.
claxon = "0.4"
