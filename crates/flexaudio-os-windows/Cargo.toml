[package]
name = "flexaudio-os-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Windows system and per-process audio capture backend (WASAPI loopback) for flexaudio."
readme = "README.md"
keywords = ["audio", "wasapi", "loopback", "capture", "windows"]
categories = ["multimedia::audio", "os::windows-apis"]
documentation = "https://docs.rs/flexaudio-os-windows"

# Windows-only crate. The backend itself compiles to nothing on non-Windows targets via
# `#[cfg(target_os = "windows")]`, and the windows dependency is pulled in only by the
# target-specific sections below. Only the pure build-number function also compiles on
# non-Windows targets.
[target.'cfg(target_os = "windows")'.dependencies]
flexaudio-core = { path = "../flexaudio-core", version = "0.3.0" }

# windows is pinned to =0.54.0 to match the version used by cpal (via flexaudio-mic).
# Features for WASAPI / process loopback / COM / PROPVARIANT are listed by hand.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "=0.54.0"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    # RtlGetVersion (the real build number, not faked by compatibility mode) and OSVERSIONINFOW.
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    # Output endpoint enumeration: property store and the FriendlyName key.
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
