[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "flexaudio"
version = "0.3.0"
description = "Flexible cross-platform audio capture (microphone, system loopback, per-process) for Python, via native bindings to the flexaudio Rust library."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "tubome (Studio Sadola)" }]
keywords = ["audio", "capture", "loopback", "recording", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/Studio-Sadola/flexaudio"

# Build with extension-module enabled (do not link libpython directly). Because it goes
# through a crate feature, it stays disabled under cargo test (avoiding the trap where the
# test binary cannot link libpython). The abi3 setting is decided by the pyo3 features in
# Cargo.toml (abi3-py38).
[tool.maturin]
features = ["extension-module"]
# Pin the import name to `flexaudio` (matches the [lib] name).
module-name = "flexaudio"
# Bundle the third-party license notices into both the wheel and the sdist. Because the
# pure-Rust tract and the (embedded) Silero VAD model are redistributed via VAD, their notices
# must be included in the distribution. The LICENSE itself is placed in .dist-info by
# `license = { file = "LICENSE" }` above. Plain strings in include go into both the sdist and
# the wheel.
include = ["THIRD_PARTY_NOTICES.md"]
