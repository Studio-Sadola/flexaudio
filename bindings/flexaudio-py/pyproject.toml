[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "flexaudio"
version = "0.3.0"
description = "Flexible cross-platform audio capture (microphone, system loopback, per-process) for Python, via native bindings to the flexaudio Rust library."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "tubome (Studio Sadola)" }]
keywords = ["audio", "capture", "loopback", "recording", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/Studio-Sadola/flexaudio"

# Build with extension-module enabled (do not link libpython directly). It is enabled through a
# crate feature, so it remains disabled for cargo test (avoiding test binaries that cannot link
# libpython). The pyo3 features in Cargo.toml (abi3-py38) configure abi3.
[tool.maturin]
features = ["extension-module"]
# Fix the import name as `flexaudio` (matching [lib] name).
module-name = "flexaudio"
# Include third-party license notices in both the wheel and sdist. Since the VAD addon redistributes
# pure-Rust tract and the embedded Silero VAD model, their notices must be included in the package.
# The `license = { file = "LICENSE" }` setting above stores LICENSE in .dist-info. Plain strings
# in include are included in both the sdist and wheel.
include = ["THIRD_PARTY_NOTICES.md"]
