[package]
name = "flexaudio-py"
version.workspace = true
edition.workspace = true
license.workspace = true
# The VAD add-on (flexaudio-vad) specifies 1.91 because tract-onnx 0.23.7 requires it, so
# this crate, which pulls it in, is aligned to 1.91 as well (flexaudio-napi does the same;
# pyo3's own MSRV is 1.83, but we match the maximum across dependencies).
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "PyO3 Python binding for flexaudio. Distributed via PyPI, not crates.io."
# A cdylib cannot be consumed as a library from crates.io (distributed via PyPI).
publish = false

# Python extension module. The path by which Python apps call flexaudio in-process.
# The cdylib is imported as `flexaudio` (platform extension .so/.pyd).
[lib]
name = "flexaudio"
crate-type = ["cdylib"]

[features]
# maturin ([tool.maturin] features in pyproject) enables this for the extension build.
# Putting extension-module in default breaks `cargo test`, because the test binary cannot
# link libpython (an extension assumes it links against the Python runtime at load time), so
# only this is made optional and cargo build / test stay plain.
extension-module = ["pyo3/extension-module"]

[dependencies]
flexaudio = { path = "../../crates/flexaudio" }

# Add-ons. Linked directly to expose the Rust core's VAD / FLAC / denoise to Python.
# None of them depends on flexaudio-core; each is a self-contained crate that takes only
# interleaved f32 samples (models and encoders are embedded; no network needed at runtime).
flexaudio-vad = { path = "../../crates/flexaudio-vad" }
flexaudio-encode = { path = "../../crates/flexaudio-encode" }
flexaudio-denoise = { path = "../../crates/flexaudio-denoise" }

# pyo3 0.29 (the latest stable of the 2025 line).
# - abi3-py38: emits a single stable-ABI wheel shared by Python 3.8 and later (no need to
#   rebuild for every minor version).
# - extension-module (load as a Python extension without linking libpython directly) is
#   enabled only by maturin, via the crate feature above.
pyo3 = { version = "0.29", features = ["abi3-py38"] }
