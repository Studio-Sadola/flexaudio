[package]
name = "flexaudio-py"
version.workspace = true
edition.workspace = true
license.workspace = true
# The VAD add-on (flexaudio-vad) requires Rust 1.91 through tract-onnx 0.23.7, so this crate also
# targets 1.91 (as does flexaudio-napi). pyo3 itself has an MSRV of 1.83; use the highest dependency MSRV.
rust-version = "1.91"
authors.workspace = true
repository.workspace = true
description = "PyO3 Python binding for flexaudio. Distributed via PyPI, not crates.io."
# A cdylib cannot be consumed as a library from crates.io (this is distributed via PyPI).
publish = false

# Python extension module: lets Python applications call flexaudio in-process.
# Import the cdylib as `flexaudio` (a platform extension, .so/.pyd).
[lib]
name = "flexaudio"
crate-type = ["cdylib"]

[features]
# maturin enables this for extension builds through the [tool.maturin] features in pyproject.
# Making extension-module a default breaks `cargo test`, whose test binaries cannot link libpython
# (extensions are expected to link to Python at runtime), so keep this feature optional. Plain cargo
# build/test then work without it.
extension-module = ["pyo3/extension-module"]

[dependencies]
flexaudio = { path = "../../crates/flexaudio" }

# Add-ons linked directly to expose the Rust VAD / FLAC / denoise features to Python.
# They do not depend on flexaudio-core and are self-contained crates that accept only interleaved
# f32 samples (models and encoders are embedded; no runtime network access is needed).
flexaudio-vad = { path = "../../crates/flexaudio-vad" }
flexaudio-encode = { path = "../../crates/flexaudio-encode" }
flexaudio-denoise = { path = "../../crates/flexaudio-denoise" }

# pyo3 0.29 (the latest stable release in the 2025 series).
# - abi3-py38: build one stable-ABI wheel for Python 3.8 and later, without rebuilding for each minor release.
# - maturin alone enables extension-module through the crate feature above. This loads the module as a
#   Python extension without linking libpython directly.
pyo3 = { version = "0.29", features = ["abi3-py38"] }
